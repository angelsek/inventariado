name: Construir APK

# Genera un APK instalable de Android y lo deja como archivo descargable
# en la página de la ejecución (sección "Artifacts").
#
# Cuándo corre (los builds tardan ~15 min, por eso ya no se lanzan en cada push):
#   - A mano: Actions → Construir APK → Run workflow. Con "publicar" marcado y desde main,
#     además lo publica para los clientes (Release de GitHub + aviso en las apps).
#   - Al subir un tag de versión (git tag -a v1.0.1 -m "Novedades…" && git push origin v1.0.1):
#     compila y publica. El tag debe coincidir con expo.version de app.json; las notas salen
#     de la anotación del tag.
#   - En PRs que tocan dependencias o configuración nativa: solo compila (sin firma propia
#     ni publicación) para comprobar que el APK sigue generándose.
# Ver docs/PILOTO.md.
#
# Solo se publica desde main: un tag debe apuntar a un commit que ya esté en main.
# No lances otra publicación mientras una esté en curso: GitHub deja solo una en espera por grupo
# y la siguiente reemplazaría a la que estaba esperando.
#
# Importante: no renombres este archivo. El versionCode del APK es el número de ejecución
# del workflow y renombrarlo lo reiniciaría (las apps dejarían de ver versiones nuevas).
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar para los clientes (solo desde main; la app avisará que hay versión nueva)'
        type: boolean
        default: false
      notas:
        description: 'Novedades de esta versión (opcional)'
        type: string
        default: ''
      obligatoria:
        description: 'Actualización obligatoria'
        type: boolean
        default: false
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - app.json
      - app.config.ts
      - eas.json
      - 'assets/**'
      - 'plugins/**'
      - 'modules/**'
      - .github/workflows/build-apk.yml

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      archivo: ${{ steps.nombre.outputs.archivo }}
      version: ${{ steps.nombre.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Falla pronto (antes de ~15 min de compilación) si lo pedido no se puede publicar.
      - name: Comprobar versión y origen
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          PUBLICAR: ${{ inputs.publicar }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión de app.json ('$VERSION') no tiene el formato X.Y.Z."
            exit 1
          fi
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$PUBLICAR" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Solo se publica desde main. Lanza el workflow eligiendo la rama main."
            exit 1
          fi
          if [ "$EVENTO" = "push" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $VERSION de app.json."
              exit 1
            fi
            ESTADO=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
            case "$ESTADO" in
              behind | identical) ;;
              *) echo "::error::El tag $GITHUB_REF_NAME no apunta a un commit de main ($ESTADO): no se publica."; exit 1 ;;
            esac
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - run: npm ci

      - name: Generar proyecto Android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install --clean

      # Clave de firma definitiva (secretos del repositorio, ver docs/PILOTO.md).
      # Sin ella se firma con la clave de desarrollo. En los PR y otras ramas no se carga: solo se comprueba que compila.
      - name: Preparar clave de firma
        # Solo en main o en tags de versión: una rama sin revisar no recibe la clave de firma.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin clave de firma propia: se usa la clave de desarrollo."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        # Datos del proyecto Supabase (Settings → Secrets and variables → Actions → Variables).
        # Son públicos por diseño: la seguridad la dan las reglas RLS de la base.
        env:
          # Cobro con Google Play Billing (expo-iap también soporta otras tiendas).
          ORG_GRADLE_PROJECT_openiapStore: play
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          # Opcionales: dónde avisar los pagos de la suscripción (pantalla Suscripción).
          EXPO_PUBLIC_CONTACTO_WHATSAPP: ${{ vars.CONTACTO_WHATSAPP }}
          EXPO_PUBLIC_CONTACTO_CORREO: ${{ vars.CONTACTO_CORREO }}
          EXPO_PUBLIC_DATOS_TRANSFERENCIA: ${{ vars.DATOS_TRANSFERENCIA }}
          # Instalación directa: la app avisa de versiones nuevas publicadas en Supabase.
          EXPO_PUBLIC_CANAL: apk
        # Solo arquitecturas de teléfonos reales: APK más liviano y compilación más rápida.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Nombrar APK
        id: nombre
        env:
          CODIGO: ${{ github.run_number }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          ARCHIVO="stockeao-v${VERSION}-${CODIGO}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$ARCHIVO"
          echo "archivo=$ARCHIVO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.nombre.outputs.archivo }}
          path: ${{ steps.nombre.outputs.archivo }}
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}

  # Publica el APK como Release de GitHub (el repo es público y acepta archivos de hasta
  # 2 GB; Supabase gratis solo acepta 50 MB y el APK pesa ~70 MB) y registra la versión en
  # Supabase para que las apps avisen. Requiere el secreto SUPABASE_SERVICE_ROLE_KEY.
  # Va en un job aparte para que el permiso de escritura y la clave de Supabase no
  # convivan con npm ci ni con la compilación.
  publicar:
    needs: apk
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publicar && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Nunca se cancela a mitad: dejaría una Release sin registrar.
    concurrency:
      group: publicar-apk
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.apk.outputs.archivo }}

      - name: Publicar para los clientes
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CLAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARCHIVO: ${{ needs.apk.outputs.archivo }}
          VERSION: ${{ needs.apk.outputs.version }}
          CODIGO: ${{ github.run_number }}
          EVENTO: ${{ github.event_name }}
          NOTAS_MANUALES: ${{ inputs.notas }}
          OBLIGATORIA_MANUAL: ${{ inputs.obligatoria }}
        run: |
          if [ -z "$CLAVE" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_SERVICE_ROLE_KEY o la variable SUPABASE_URL."
            exit 1
          fi
          # Segunda comprobación (la primera está en el job apk): solo se publica un commit de main.
          ESTADO=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$ESTADO" in
            behind | identical) ;;
            *) echo "::error::El commit no está en main ($ESTADO): no se publica."; exit 1 ;;
          esac
          if [ "$EVENTO" = "push" ]; then
            # Publicación por tag: las notas salen de su anotación, sin la firma PGP si la tiene
            # (un tag ligero publica sin notas). La versión ya se comprobó en el job apk.
            OBJETO=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
            NOTAS=""
            if [ "${OBJETO%% *}" = "tag" ]; then
              NOTAS=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${OBJETO#* }" --jq '.message' |
                sed -e '/^-----BEGIN \(PGP\|SSH\|SIGNED\|CMS\)/,$d' -e 's/[[:space:]]*$//')
            else
              echo "::warning::Tag ligero (sin anotación): se publica sin notas."
            fi
            OBLIGATORIA=false
          else
            NOTAS="$NOTAS_MANUALES"
            OBLIGATORIA="${OBLIGATORIA_MANUAL:-false}"
          fi
          NOTAS="${NOTAS:0:2000}"

          # Siempre con el mismo nombre: así el enlace .../releases/latest/download/stockeao.apk
          # descarga la última versión (es el que usa la página de descarga).
          cp "$ARCHIVO" stockeao.apk
          ETIQUETA="apk-$CODIGO"
          gh release create "$ETIQUETA" stockeao.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Stockeao $VERSION ($CODIGO)" --notes "${NOTAS:-Versión $VERSION ($CODIGO).}"

          URL_APK="https://github.com/$GITHUB_REPOSITORY/releases/download/$ETIQUETA/stockeao.apk"
          # Las claves nuevas (sb_secret_...) van solo en "apikey"; las antiguas (JWT) también como Bearer.
          CABECERAS=(-H "apikey: $CLAVE")
          case "$CLAVE" in sb_*) ;; *) CABECERAS+=(-H "Authorization: Bearer $CLAVE") ;; esac
          jq -n --argjson codigo "$CODIGO" --arg version "$VERSION" --arg url "$URL_APK" \
            --arg notas "$NOTAS" --argjson obligatoria "$OBLIGATORIA" \
            '{version_code: $codigo, version: $version, url: $url, notas: (if $notas == "" then null else $notas end), obligatoria: $obligatoria}' \
            > version.json
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/versiones_app" \
            "${CABECERAS[@]}" -H "Content-Type: application/json" \
            -H "Content-Profile: inventariado" -H "Prefer: resolution=merge-duplicates" \
            --data @version.json
          echo
          echo "Publicado: $URL_APK"
          echo "Enlace fijo a la última versión: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/stockeao.apk"
