name: Web

# Comprueba que la versión web (PC) siga compilando en los PR que la tocan.
#
# La publicación no pasa por aquí: el proyecto "stockeao-web" de Cloudflare Workers está
# conectado al repositorio y compila y publica solo (main → producción en
# https://stockeao.grimoriolabs.com). Ver wrangler.jsonc.
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - app.json
      - metro.config.js
      - wrangler.jsonc
      - 'public/**'
      - 'src/**'
      - scripts/construir-web.mjs
      - scripts/sw-plantilla.js
      - .github/workflows/web.yml

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construir
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npx expo export --platform web && node scripts/construir-web.mjs
