name: Construir para Google Play

# Genera el Android App Bundle (.aab) que se sube a Google Play Console.
# Debe firmarse con la clave propia (secretos ANDROID_KEYSTORE_*, ver docs/PILOTO.md):
# Google Play rechaza archivos firmados con la clave de desarrollo.
#
# Si existe el secreto PLAY_SERVICE_ACCOUNT_JSON, además lo sube a la pista
# elegida de Play Console (ver docs/PLAY_STORE.md). La primera subida de la app
# siempre debe hacerse a mano desde Play Console: para esa vez, desmarca "subir".
#
# Lo lanza a mano (Actions → Construir para Google Play → Run workflow) o solo el workflow
# «Construir APK» al terminar de publicar una versión (job `play`; se desactiva con la variable
# del repositorio PLAY_AUTO=no).
on:
  workflow_dispatch:
    inputs:
      pista:
        description: 'Pista de Play Console donde subirlo (si está configurada la cuenta de servicio)'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      notas:
        description: 'Novedades de esta versión (se muestran en Play Store)'
        type: string
        default: ''
      subir:
        description: 'Subir a Play Console (desmárcalo para la primera versión de la app, que Play exige subir a mano)'
        type: boolean
        default: true
      commit:
        description: 'Uso interno de «Construir APK»: SHA exacto de main a compilar (vacío = la punta de main)'
        type: string
        default: ''

# Tarda ~20 min.
permissions:
  contents: read

concurrency:
  group: build-play
  cancel-in-progress: false

jobs:
  aab:
    # Solo desde main: una rama sin revisar no recibe la clave de firma ni la cuenta de Play.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Si piden un commit concreto, debe ser de main (la misma regla que el APK) y además la punta
      # de main o el commit de una Release ya publicada: así este workflow nunca compila ni firma
      # un commit sin revisar ni uno antiguo cualquiera.
      - name: Comprobar commit pedido
        if: inputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::El commit pedido no es un SHA completo (40 caracteres hexadecimales)."
            exit 1
          fi
          ESTADO=$(gh api "repos/$GITHUB_REPOSITORY/compare/heads/main...$COMMIT" --jq .status)
          case "$ESTADO" in
            behind | identical) ;;
            *) echo "::error::El commit $COMMIT no está en main ($ESTADO): no se compila."; exit 1 ;;
          esac
          PUNTA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$COMMIT" != "$PUNTA" ] &&
            ! gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '.[].target_commitish' | grep -Fxq "$COMMIT"; then
            echo "::error::El commit $COMMIT no es la punta de main ni el de una versión publicada: no se compila."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Caché básica (MIT). Desde v6 la caché por defecto es un componente propietario con
          # términos de uso de Gradle; la básica no los requiere.
          cache-provider: basic

      - run: npm ci

      # Los números de versión de Play parten en 1001 para no confundirse con los APK directos.
      - name: Generar proyecto Android
        env:
          # Sin el permiso para instalar APK (ver app.config.ts): Play no lo acepta.
          EXPO_PUBLIC_CANAL: play
          EJECUCION: ${{ github.run_number }}
        run: |
          echo "VERSION_CODE=$((1000 + EJECUCION))" >> "$GITHUB_ENV"
          ANDROID_VERSION_CODE=$((1000 + EJECUCION)) npx expo prebuild --platform android --no-install --clean

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta la clave de firma (secreto ANDROID_KEYSTORE_BASE64). Ver docs/PILOTO.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Compilar App Bundle
        working-directory: android
        env:
          # Cobro con Google Play Billing (expo-iap también soporta otras tiendas).
          ORG_GRADLE_PROJECT_openiapStore: play
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CONTACTO_WHATSAPP: ${{ vars.CONTACTO_WHATSAPP }}
          EXPO_PUBLIC_CONTACTO_CORREO: ${{ vars.CONTACTO_CORREO }}
          EXPO_PUBLIC_DATOS_TRANSFERENCIA: ${{ vars.DATOS_TRANSFERENCIA }}
          # Instalada desde Play: las actualizaciones las entrega Play, no el aviso de APK.
          EXPO_PUBLIC_CANAL: play
        run: ./gradlew bundleRelease --no-daemon

      - name: Nombrar AAB
        id: nombre
        # Las notas van por env y no interpoladas en el script: así un texto con comillas o $(...)
        # no se ejecuta como comando.
        env:
          NOTAS: ${{ inputs.notas }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          ARCHIVO="stockeao-v${VERSION}-${VERSION_CODE}.aab"
          mv android/app/build/outputs/bundle/release/app-release.aab "$ARCHIVO"
          echo "archivo=$ARCHIVO" >> "$GITHUB_OUTPUT"
          # Play acepta hasta 500 caracteres de novedades por idioma: se recorta (por caracteres,
          # no por bytes) y, si queda vacío, no se envía el directorio de novedades.
          mkdir -p notas
          HAY_NOTAS=$(node -e '
            const t = Array.from((process.env.NOTAS || "").trim());
            const n = t.length > 500 ? t.slice(0, 499).join("").trimEnd() + "…" : t.join("");
            require("fs").writeFileSync("notas/whatsnew-es-419", n);
            process.stdout.write(n ? "si" : "no");
          ')
          echo "notas=$HAY_NOTAS" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.nombre.outputs.archivo }}
          path: ${{ steps.nombre.outputs.archivo }}
          retention-days: 90

      - name: Revisar cuenta de servicio de Play
        id: play
        if: inputs.subir
        env:
          CUENTA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$CUENTA" ]; then
            echo "configurada=si" >> "$GITHUB_OUTPUT"
          else
            echo "configurada=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin cuenta de servicio (PLAY_SERVICE_ACCOUNT_JSON): el .aab queda solo en Artifacts."
          fi

      - name: Avisar que no se sube
        if: '${{ !inputs.subir }}'
        run: |
          echo "::notice::Subida a Play Console omitida: el .aab queda en Artifacts para subirlo a mano."

      - name: Subir a Google Play
        if: inputs.subir && steps.play.outputs.configurada == 'si'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cl.stockeao.app
          releaseFiles: ${{ steps.nombre.outputs.archivo }}
          track: ${{ inputs.pista || 'internal' }}
          status: ${{ inputs.pista == 'production' && 'draft' || 'completed' }}
          whatsNewDirectory: ${{ steps.nombre.outputs.notas == 'si' && 'notas' || '' }}
