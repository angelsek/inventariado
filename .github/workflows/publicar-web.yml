name: Publicar web

# Versión web (PC) de Stockeao: https://stockeao.grimoriolabs.com, en Cloudflare Pages.
#
# Cuándo corre:
#   - A mano: Actions → Publicar web → Run workflow. Con "publicar" marcado y desde main, la
#     sube a Cloudflare Pages; los PC abiertos ven "Hay una versión nueva → Actualizar".
#   - En PRs que tocan la web o sus dependencias: solo compila (sin publicar), para comprobar
#     que el build web sigue funcionando.
# Ver docs/WEB.md (proyecto de Cloudflare, dominio y secrets).
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar en stockeao.grimoriolabs.com (solo desde main)'
        type: boolean
        default: false
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - app.json
      - metro.config.js
      - 'public/**'
      - 'src/**'
      - scripts/construir-web.mjs
      - .github/workflows/publicar-web.yml

permissions:
  contents: read

concurrency:
  group: publicar-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar origen
        if: inputs.publicar
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Solo se publica desde main (rama actual: $GITHUB_REF)."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Construir
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CONTACTO_WHATSAPP: ${{ vars.CONTACTO_WHATSAPP }}
          EXPO_PUBLIC_CONTACTO_CORREO: ${{ vars.CONTACTO_CORREO }}
          EXPO_PUBLIC_DATOS_TRANSFERENCIA: ${{ vars.DATOS_TRANSFERENCIA }}
          EXPO_PUBLIC_WEB_CODIGO: ${{ github.run_number }}
        run: npm run web:construir

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stockeao-web
          path: dist
          retention-days: 7

  publicar:
    needs: web
    if: inputs.publicar && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stockeao-web
          path: dist
      - name: Subir a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.147.0 pages deploy dist
          --project-name stockeao-web --branch main --commit-dirty=true
