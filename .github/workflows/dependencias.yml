name: Dependencias

# Auditoría de dependencias (npm audit) contra las excepciones documentadas en
# scripts/excepciones-audit.json. Ver docs/SEGURIDAD_DEPENDENCIAS.md.
#
# - En los PR que tocan package.json o package-lock.json, una vulnerabilidad nueva sin analizar
#   hace fallar el check.
# - En los demás PR y en main solo avisa: un aviso publicado hoy no bloquea un PR que no toca
#   dependencias.
# - Los lunes se revisa en modo estricto: si aparece algo nuevo, la ejecución queda en rojo y
#   GitHub avisa por correo.
# De momento es informativo (no es un check obligatorio de main).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Lunes 07:23 UTC.
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependencias-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Sin caché: desde v5 se activaría sola si package.json declarase packageManager.
          package-manager-cache: false

      - name: ¿El PR toca dependencias?
        id: cambios
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Lista de archivos por la API (sin el límite de tamaño de `gh pr diff`). Si la consulta
        # falla, se asume que sí toca dependencias: mejor auditar en estricto que dejarlo pasar.
        run: |
          if ! ARCHIVOS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "::warning::No se pudo obtener la lista de archivos del PR: se audita en modo estricto."
            echo "toca=si" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$ARCHIVOS" | grep -qxE 'package(-lock)?\.json'; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"
          fi

      # npm audit lee package-lock.json: no hace falta instalar las dependencias.
      - name: Auditar dependencias
        env:
          AUDIT_ESTRICTO: ${{ github.event_name == 'schedule' || steps.cambios.outputs.toca == 'si' }}
        run: npm run audit:revisar
