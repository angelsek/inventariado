name: Publicar funciones de Supabase

# Publica las funciones de supabase/functions (cobro con Google Play) en el
# proyecto de Supabase y les carga los secretos. Ver docs/COBRO_GOOGLE_PLAY.md.
#
# Secretos del repositorio necesarios:
#   SUPABASE_ACCESS_TOKEN             token personal de Supabase (Account → Access Tokens)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  clave JSON de la cuenta de servicio de Google Cloud
#   PLAY_RTDN_TOKEN                   texto secreto cualquiera para los avisos de Google
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/publicar-funciones.yml']

permissions:
  contents: read

concurrency:
  group: publicar-funciones
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Revisar configuración
        id: config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta el secreto SUPABASE_ACCESS_TOKEN: no se publican las funciones."
            echo "listo=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # https://<ref>.supabase.co → <ref>
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "listo=si" >> "$GITHUB_OUTPUT"

      - name: Cargar secretos de las funciones
        if: steps.config.outputs.listo == 'si'
        env:
          REF: ${{ steps.config.outputs.ref }}
          CUENTA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RTDN: ${{ secrets.PLAY_RTDN_TOKEN }}
        run: |
          ARGS=("PLAY_PACKAGE_NAME=cl.stockeao.app")
          [ -n "$CUENTA" ] && ARGS+=("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=$CUENTA")
          [ -n "$RTDN" ] && ARGS+=("PLAY_RTDN_TOKEN=$RTDN")
          npx --yes supabase@2.119.0 secrets set --project-ref "$REF" "${ARGS[@]}"

      - name: Publicar funciones
        if: steps.config.outputs.listo == 'si'
        env:
          REF: ${{ steps.config.outputs.ref }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          npx --yes supabase@2.119.0 functions deploy verificar-compra-play \
            --project-ref "$REF" --use-api
          # Google Pub/Sub no tiene sesión de Supabase: se protege con ?token=PLAY_RTDN_TOKEN.
          npx --yes supabase@2.119.0 functions deploy notificaciones-play \
            --project-ref "$REF" --use-api --no-verify-jwt
          echo "Dirección para Pub/Sub: $SUPABASE_URL/functions/v1/notificaciones-play?token=<PLAY_RTDN_TOKEN>"
